<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/producto-detalle.css" />
    <link rel="stylesheet" href="./src/variables.css" />
    <link rel="stylesheet" href="./src/header.css" />
    <link rel="stylesheet" href="./src/footer.css" />
    <title>Producto en detalle</title>
    <link rel="icon" type="image/png" href="/src/img/logo_ig.webp" />
  </head>
  <body>
    <!-- ============================HEDER========================== -->
    <div id="header-container"></div>
    <!-- ====================================================== -->

    <main class="product-detail">
      <section id="product-container" class="product-container-detail">
        <!-- contenido dinámico -->
      </section>
    </main>

    <section class="related-products-section">
      <h2>Productos similares</h2>

      <div id="related-products" class="related-products-grid"></div>
    </section>

    <!-- ====================================================== -->
    <!-- ========================FOOTER======================================== -->

    <div id="footer-container"></div>

    <!-- VISOR DE IMÁGENES -->
    <div id="image-modal" class="image-modal">
      <button id="image-modal-close" class="image-modal-close">×</button>

      <button id="image-modal-prev" class="image-modal-arrow image-modal-prev">
        ‹
      </button>

      <div class="image-modal-content">
        <img id="image-modal-image" src="" alt="Imagen del producto" />
      </div>

      <button id="image-modal-next" class="image-modal-arrow image-modal-next">
        ›
      </button>
    </div>

    <script src="./js/producto-detalle.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/header.js"></script>
  </body>
</html>
