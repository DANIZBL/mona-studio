<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/variables.css" />
    <link rel="stylesheet" href="./src/header.css" />
    <link rel="stylesheet" href="./src/footer.css" />
    <link rel="stylesheet" href="./src/servicios.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- ============================HEDER========================== -->
    <header class="main-header">
      <div class="mobile-header">
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <a href="index.html">
          <img src="./src/img/logomona.webp" alt="Logo" class="mobile-logo" />
        </a>

        <div class="mobile-actions">
          <button class="mobile-search-toggle">
            <img src="./src/img/lupa.svg" alt="Buscar" />
          </button>

          <div class="cart">
            <button class="cart-icon">
              <img src="./src/img/carrito.svg" alt="" />
            </button>

            <span class="cart-count">0</span>
          </div>
        </div>
      </div>

      <nav class="nav">
        <a class="boton" href="index.html">INICIO</a>
        <a class="boton" href="#servicios">SERVICIOS</a>
        <img src="./src/img/logomona.webp" alt="Logo" class="logo" />
        <a class="boton" href="productos.html">TIENDA</a>

        <a class="boton" href="#">INFO Y CONTACTO</a>

        <div class="search-container">
          <button class="search-toggle">
            <img src="./src/img/lupa.svg" alt="Buscar" />
          </button>

          <div class="search-box">
            <input
              type="text"
              id="header-search"
              placeholder="Buscar productos..."
              autocomplete="off"
            />

            <div id="search-results"></div>
          </div>
        </div>

        <div class="cart">
          <button class="cart-icon">
            <img src="./src/img/carrito.svg" alt="" />
          </button>
          <span class="cart-count">0</span>
        </div>
      </nav>
    </header>
    <div class="overlay"></div>
    <!-- ====================================================== -->

    <!-- ====================================================== -->

    <footer class="footer">
      <div class="footer-container">
        <!-- SEGUINOS -->
        <div class="footer-column">
          <h3 class="footer-toggle">SEGUINOS</h3>
          <div class="footer-content">
            <div class="social-icons">
              <img
                src="./src/img/redes1.png"
                alt="Instagram"
                class="social-icon"
              />
            </div>
          </div>
        </div>

        <!-- NAVEGACIÓN -->
        <div class="footer-column">
          <h3 class="footer-toggle">NAVEGACIÓN</h3>
          <div class="footer-content">
            <ul>
              <li><a href="#">INICIO</a></li>
              <li><a href="#">SERVICIOS</a></li>
              <li><a href="#">TIENDA</a></li>
              <li><a href="#">CURSOS</a></li>
              <li><a href="#">INFO Y CONTACTO</a></li>
            </ul>
          </div>
        </div>

        <!-- CONTACTO -->
        <div class="footer-column">
          <h3 class="footer-toggle">CONTACTÁNOS</h3>
          <div class="footer-content">
            <p>WHATSAPP</p>
            <p>EMAIL</p>
            <p>DIRECCION</p>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
