<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda Mona</title>
    <link rel="icon" type="image/png" href="/src/img/logo_ig.webp" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!DOCTYPE html>
    <html lang="es">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Productos | Mona Studio</title>
        <link rel="stylesheet" href="./src/footer.css" />
        <link rel="stylesheet" href="./src/header.css" />

        <link rel="stylesheet" href="./src/productos.css" />
        <link rel="stylesheet" href="./src/variables.css" />
      </head>
      <body>
        <!-- ============================HEDER========================== -->
        <div id="header-container"></div>
        <!-- ====================================================== -->

        <section class="products-hero">
          <h1>PRODUCTOS</h1>

          <p>
            Descubrí nuestros productos favoritos para complementar tu
            experiencia de belleza.
          </p>
        </section>

        <div class="products-info">
          <span id="products-count"></span>
          <span id="active-category"></span>
        </div>

        <section class="products-container">
          <aside class="sidebar">
            <h3>Categorías</h3>

            <div id="categories-container">
              <!-- categorías dinámicas -->
            </div>
          </aside>

          <main class="products-content">
            <div id="products-loader" class="loader">Cargando productos...</div>

            <div id="products-grid" class="products-grid"></div>
          </main>
        </section>

        <!-- ========================FOOTER======================================== -->

        <div id="footer-container"></div>

        <script src="./js/header.js" defer></script>
        <script src="./js/footer.js" defer></script>
        <script src="./js/productos.js" defer></script>
      </body>
    </html>
  </body>
</html>
